# Netlify yapılandırması — illerilceler.com
# Bu dosya repoda olduğu için Netlify arayüzünde ayrıca build ayarı yapmaya gerek yoktur.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------------------------------------------------------------------------
# Yönlendirmeler
# ---------------------------------------------------------------------------

# Eski / alternatif URL'ler → kanonik sayfalar (301 = kalıcı, SEO değerini taşır)
[[redirects]]
  from = "/il/*"
  to = "/iller/:splat"
  status = 301

[[redirects]]
  from = "/plaka/*"
  to = "/plaka-kodlari/:splat"
  status = 301

[[redirects]]
  from = "/alan-kodu/*"
  to = "/alan-kodlari/:splat"
  status = 301

[[redirects]]
  from = "/posta-kodu/*"
  to = "/posta-kodlari/:splat"
  status = 301

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301

# ---------------------------------------------------------------------------
# Güvenlik başlıkları (tüm sayfalar)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"

# ---------------------------------------------------------------------------
# Önbellek (Core Web Vitals / hız)
# ---------------------------------------------------------------------------

# Astro'nun hash'li dosyaları asla değişmez → 1 yıl, immutable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/harita/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/veri/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# HTML her zaman taze kontrol edilir (Netlify CDN yine de kenarda önbellekler)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
